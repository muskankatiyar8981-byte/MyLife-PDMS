<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyLife - Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background: #eeeeF1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #292833;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 12px;
            border-radius: 20px;
            background: #e6e0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 25px rgba(90, 75, 145, 0.10);
        }

        .brand h1 {
            font-size: 29px;
            color: #6250a4;
            font-weight: 700;
        }

        .brand p {
            color: #85828e;
            font-size: 13px;
            margin-top: 3px;
        }

        .card {
            background: white;
            border: 1px solid #e3e2e7;
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 15px 45px rgba(45, 43, 60, 0.08);
        }

        .card h2 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #898691;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .error {
            background: #f9e0e0;
            color: #a13f3f;
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 12px;
            margin-bottom: 18px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #575462;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            border: 1px solid #dedde4;
            background: #fafafa;
            border-radius: 11px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 13px;
            color: #292833;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus {
            background: white;
            border-color: #9583cb;
            box-shadow: 0 0 0 3px rgba(107, 87, 173, 0.08);
        }

        .create-btn {
            width: 100%;
            border: none;
            background: #6955a9;
            color: white;
            padding: 13px;
            border-radius: 11px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s ease;
        }

        .create-btn:hover {
            background: #56438e;
            transform: translateY(-1px);
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #85828e;
        }

        .login-text a {
            color: #6250a4;
            font-weight: 600;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #aaa7b1;
            font-size: 11px;
            margin-top: 18px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <div class="brand">
            <div class="brand-icon">💜</div>
            <h1>MyLife</h1>
            <p>Plan • Organize • Achieve</p>
        </div>

        <div class="card">

            <h2>Create Account ✨</h2>
            <p class="subtitle">Create your personal space</p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('signup') }}">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="create-btn">
                    Create Account
                </button>

            </form>

            <div class="login-text">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </div>

        </div>

        <div class="footer">
            💜 Your personal space, your life.
        </div>

    </div>

</body>
</html>
