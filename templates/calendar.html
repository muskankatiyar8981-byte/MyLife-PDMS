{% extends "base.html" %}

{% block content %}

<style>
    .calendar-page {
        padding: 25px;
        max-width: 1200px;
        margin: auto;
    }

    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 15px;
        flex-wrap: wrap;
    }

    .calendar-title h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
    }

    .calendar-title p {
        margin: 7px 0 0;
        color: #777;
    }

    .month-controls {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .month-controls button {
        border: none;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 20px;
        background: #eeeeee;
    }

    .month-controls button:hover {
        background: #dddddd;
    }

    #monthYear {
        min-width: 180px;
        text-align: center;
        font-size: 21px;
        font-weight: 600;
    }

    .calendar-card {
        background: white;
        border-radius: 22px;
        padding: 18px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        margin-bottom: 8px;
    }

    .weekday {
        text-align: center;
        font-weight: 600;
        color: #777;
        padding: 10px 4px;
        font-size: 14px;
    }

    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
    }

    .calendar-day {
        min-height: 105px;
        border: 1px solid #eeeeee;
        border-radius: 15px;
        padding: 9px;
        background: #fafafa;
        cursor: pointer;
        transition: 0.2s;
    }

    .calendar-day:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    .calendar-day.empty {
        background: transparent;
        border: none;
        cursor: default;
    }

    .day-number {
        font-weight: 700;
        margin-bottom: 6px;
    }

    .today {
        border: 2px solid #777 !important;
        background: #f0f0f0;
    }

    .event {
        font-size: 11px;
        padding: 4px 6px;
        margin-top: 4px;
        border-radius: 7px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .task-event {
        background: #e7e7e7;
    }

    .study-event {
        background: #ededed;
    }

    .assignment-event {
        background: #dcdcdc;
    }

    .completed-event {
        text-decoration: line-through;
        opacity: 0.55;
    }

    .legend {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 18px;
        color: #666;
        font-size: 13px;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .legend-box {
        width: 13px;
        height: 13px;
        border-radius: 4px;
    }

    .legend-task {
        background: #e7e7e7;
    }

    .legend-study {
        background: #ededed;
    }

    .legend-assignment {
        background: #dcdcdc;
    }

    .event-list {
        margin-top: 25px;
    }

    .event-list h2 {
        font-size: 22px;
        margin-bottom: 15px;
    }

    .event-card {
        background: white;
        border-radius: 16px;
        padding: 15px;
        margin-bottom: 10px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .event-card-title {
        font-weight: 600;
        font-size: 16px;
    }

    .event-card-info {
        color: #777;
        font-size: 13px;
        margin-top: 5px;
    }

    .no-events {
        color: #888;
        padding: 15px 0;
    }

    @media (max-width: 700px) {

        .calendar-page {
            padding: 12px;
        }

        .calendar-day {
            min-height: 75px;
            padding: 5px;
        }

        .event {
            font-size: 9px;
        }

        .weekday {
            font-size: 11px;
        }

        .day-number {
            font-size: 12px;
        }

        #monthYear {
            min-width: 140px;
        }
    }
</style>


<div class="calendar-page">

    <div class="calendar-header">

        <div class="calendar-title">
            <h1>📅 Calendar</h1>
            <p>Plan your tasks, studies and assignments</p>
        </div>

        <div class="month-controls">

            <button onclick="previousMonth()">
                ‹
            </button>

            <div id="monthYear"></div>

            <button onclick="nextMonth()">
                ›
            </button>

        </div>

    </div>


    <div class="calendar-card">

        <div class="weekdays">
            <div class="weekday">Sun</div>
            <div class="weekday">Mon</div>
            <div class="weekday">Tue</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Thu</div>
            <div class="weekday">Fri</div>
            <div class="weekday">Sat</div>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>

        <div class="legend">

            <div class="legend-item">
                <span class="legend-box legend-task"></span>
                Tasks
            </div>

            <div class="legend-item">
                <span class="legend-box legend-study"></span>
                Study
            </div>

            <div class="legend-item">
                <span class="legend-box legend-assignment"></span>
                Assignments
            </div>

        </div>

    </div>


    <div class="event-list">

        <h2>📌 Upcoming Items</h2>

        <div id="upcomingEvents"></div>

    </div>

</div>


<script>

    /*
       IMPORTANT:
       These are the only variables received from app.py.
       They are converted to JSON safely.
    */

    const tasks = {{ tasks | default([]) | tojson | safe }};

    const assignments = {{ assignments | default([]) | tojson | safe }};

    const studyPlans = {{ study_plans | default([]) | tojson | safe }};


    let currentDate = new Date();


    // =====================================================
    // CREATE EVENTS
    // =====================================================

    function getEvents() {

        let events = [];


        // -------------------------
        // Tasks
        // -------------------------

        tasks.forEach(function(task) {

            if (task.due_date) {

                events.push({
                    id: task.id,
                    title: task.title || "Task",
                    date: task.due_date,
                    type: "task",
                    completed: Number(task.completed) === 1
                });

            }

        });


        // -------------------------
        // Assignments
        // -------------------------

        assignments.forEach(function(assignment) {

            if (assignment.due_date) {

                let title = assignment.title || "Assignment";

                if (assignment.subject) {
                    title = assignment.subject + ": " + title;
                }

                events.push({
                    id: assignment.id,
                    title: title,
                    date: assignment.due_date,
                    type: "assignment",
                    completed: Number(assignment.completed) === 1
                });

            }

        });


        // -------------------------
        // Study Plans
        // -------------------------

        studyPlans.forEach(function(study) {

            if (study.study_date) {

                let title = study.subject || "Study";

                if (study.topic) {
                    title += ": " + study.topic;
                }

                events.push({
                    id: study.id,
                    title: title,
                    date: study.study_date,
                    type: "study",
                    completed: Number(study.completed) === 1
                });

            }

        });


        return events;
    }


    // =====================================================
    // CALENDAR
    // =====================================================

    function renderCalendar() {

        const year = currentDate.getFullYear();

        const month = currentDate.getMonth();

        const monthNames = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
        ];

        document.getElementById("monthYear").textContent =
            monthNames[month] + " " + year;


        const grid = document.getElementById("calendarGrid");

        grid.innerHTML = "";


        const firstDay = new Date(
            year,
            month,
            1
        ).getDay();


        const daysInMonth = new Date(
            year,
            month + 1,
            0
        ).getDate();


        const events = getEvents();


        // Empty boxes before first day
        for (let i = 0; i < firstDay; i++) {

            const emptyDay = document.createElement("div");

            emptyDay.className = "calendar-day empty";

            grid.appendChild(emptyDay);
        }


        // Days
        for (let day = 1; day <= daysInMonth; day++) {

            const dayBox = document.createElement("div");

            dayBox.className = "calendar-day";


            const number = document.createElement("div");

            number.className = "day-number";

            number.textContent = day;

            dayBox.appendChild(number);


            const dateString =
                year + "-" +
                String(month + 1).padStart(2, "0") + "-" +
                String(day).padStart(2, "0");


            // Today
            const today = new Date();

            const todayString =
                today.getFullYear() + "-" +
                String(today.getMonth() + 1).padStart(2, "0") + "-" +
                String(today.getDate()).padStart(2, "0");


            if (dateString === todayString) {

                dayBox.classList.add("today");

            }


            // Events for this day
            const dayEvents = events.filter(function(event) {

                return event.date === dateString;

            });


            dayEvents.forEach(function(event) {

                const eventElement =
                    document.createElement("div");


                eventElement.className =
                    "event " +
                    event.type + "-event";


                if (event.completed) {

                    eventElement.classList.add(
                        "completed-event"
                    );

                }


                eventElement.textContent =
                    event.title;


                dayBox.appendChild(eventElement);

            });


            grid.appendChild(dayBox);

        }


        renderUpcomingEvents(events);

    }


    // =====================================================
    // UPCOMING EVENTS
    // =====================================================

    function renderUpcomingEvents(events) {

        const container =
            document.getElementById("upcomingEvents");


        container.innerHTML = "";


        const today = new Date();

        today.setHours(0, 0, 0, 0);


        const upcoming = events
            .filter(function(event) {

                if (!event.date) {
                    return false;
                }

                const eventDate =
                    new Date(event.date + "T00:00:00");

                return eventDate >= today;

            })
            .sort(function(a, b) {

                return a.date.localeCompare(b.date);

            })
            .slice(0, 10);


        if (upcoming.length === 0) {

            container.innerHTML =
                '<div class="no-events">No upcoming items 🎉</div>';

            return;

        }


        upcoming.forEach(function(event) {

            const card =
                document.createElement("div");

            card.className = "event-card";


            const title =
                document.createElement("div");

            title.className =
                "event-card-title";

            title.textContent =
                event.title;


            const info =
                document.createElement("div");

            info.className =
                "event-card-info";


            let typeText = "";

            if (event.type === "task") {
                typeText = "📝 Task";
            }

            if (event.type === "study") {
                typeText = "📚 Study";
            }

            if (event.type === "assignment") {
                typeText = "📖 Assignment";
            }


            info.textContent =
                typeText +
                " • " +
                event.date;


            card.appendChild(title);

            card.appendChild(info);


            container.appendChild(card);

        });

    }


    // =====================================================
    // MONTH NAVIGATION
    // =====================================================

    function previousMonth() {

        currentDate.setMonth(
            currentDate.getMonth() - 1
        );

        renderCalendar();

    }


    function nextMonth() {

        currentDate.setMonth(
            currentDate.getMonth() + 1
        );

        renderCalendar();

    }


    // =====================================================
    // START
    // =====================================================

    renderCalendar();

</script>

{% endblock %}
