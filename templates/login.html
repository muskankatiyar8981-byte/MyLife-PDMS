<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MyLife</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eeeeee, #dcdcdc, #f7f7f7);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: #eee8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            text-align: center;
            color: #29252f;
            font-size: 30px;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #77717e;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: #ffe5e5;
            color: #b42323;
        }

        .success {
            background: #e4f8e9;
            color: #23753a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #403b47;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd7e3;
            border-radius: 14px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background: #faf9fc;
            transition: 0.2s;
        }

        input:focus {
            border-color: #8c70d8;
            box-shadow: 0 0 0 3px rgba(140, 112, 216, 0.12);
            background: white;
        }

        button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 15px;
            background: #7657c7;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background: #6344b5;
            transform: translateY(-1px);
        }

        .signup-text {
            text-align: center;
            margin-top: 25px;
            color: #77717e;
            font-size: 14px;
        }

        .signup-text a {
            color: #7657c7;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .brand {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #99939f;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            💜
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your MyLife space
        </p>

        {% if error %}
            <div class="alert error">
                {{ error }}
            </div>
        {% endif %}

        {% if created %}
            <div class="alert success">
                Account created successfully! Please login.
            </div>
        {% endif %}

        <!-- IMPORTANT: DO NOT CHANGE THESE NAME VALUES -->
        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup-text">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Create Account</a>
        </div>

    </div>

    <div class="brand">
        💜 MyLife • Plan • Organize • Achieve
    </div>

</div>

</body>
</html>
